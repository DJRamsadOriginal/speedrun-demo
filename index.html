function storeGet(k){ k=SKEY(k); try{ return localStorage.getItem(k); }catch(e){ return mem[k]??null; } }
function storeSet(k,v){ k=SKEY(k); try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
function storeDel(k){ k=SKEY(k); try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
function loadJSON(k){ try{ const v=storeGet(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function lk(i){ const L=(typeof LEVELS!=='undefined')?LEVELS[i]:null; return L?L.name.replace(/\s+/g,'_'):String(i); }
function legacyGet(prefix,i){ let v=storeGet(prefix+lk(i)); if(v===null&&i<39) v=storeGet(prefix+i); return v; }
const loadBest=i=>{ const v=legacyGet('speedrun.best.',i); return v?parseFloat(v):null; };
const loadJSONL=(prefix,i)=>{ const v=legacyGet(prefix,i); if(!v) return null; try{ return JSON.parse(v); }catch(e){ return null; } };
const starsOf=i=>loadJSONL('speedrun.stars.',i)||[];
function saveStar(i,idx){ const a=starsOf(i); if(a.includes(idx)) return false; a.push(idx); storeSet('speedrun.stars.'+lk(i),JSON.stringify(a)); return true; }
function totalStars(){ let n=0; for(let i=0;i<LEVELS.length;i++) n+=starsOf(i).length; return n; }
function starsMax(){ let n=0; for(const L of LEVELS) for(const r of L.rows) n+=r.split('n').length-1; return n; }
const loadMarathonBest=()=>{ const v=storeGet('speedrun.marathon'); return v?parseFloat(v):null; };
const loadRuns=i=>loadJSONL('speedrun.runs.',i)||[];
const lifeDeaths=()=>parseInt(storeGet('speedrun.lifedeaths')||'0',10);

// ---------- Audio ----------
let actx=null, noiseBuf=null, sfxGain=null, musGain=null;
function ensureAudio(){
  try{
    if(!actx){
      actx=new (window.AudioContext||window.webkitAudioContext)();
      sfxGain=actx.createGain(); musGain=actx.createGain(); sfxGain.connect(actx.destination); musGain.connect(actx.destination);
      noiseBuf=actx.createBuffer(1,actx.sampleRate*1,actx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      applyVolumes();
    }
    if(actx.state==='suspended') actx.resume();
  }catch(e){}
}
const volCurve=v=>Math.pow(Math.max(0,Math.min(100,v))/100,2);
function applyVolumes(){ if(!actx) return; sfxGain.gain.value=volCurve(SET.sfx); musGain.gain.value=volCurve(SET.music)*0.7; }
function tone(f0,f1,dur,type,vol,delay=0,dest=null){
  if(!actx) return; const t=actx.currentTime+delay, o=actx.createOscillator(), g=actx.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t); if(f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dest||sfxGain); o.start(t); o.stop(t+dur+0.03);
}
function noise(dur,vol,fc=2000,delay=0){
  if(!actx) return; const t=actx.currentTime+delay, src=actx.createBufferSource(); src.buffer=noiseBuf;
  const f=actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=fc; const g=actx.createGain();
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(sfxGain); src.start(t); src.stop(t+dur+0.03);
}

  const root=playing&&lvl?(lvl.root||0):0;

// Kacheln: # fest  - Durchspring-Plattform  ^ Stachel  v Deckenstachel  T Zeit-Stachel  C Checkpoint  F Ziel  S Start
//          J Sprungpad  * Kristall  ~ bröckelt  ? Fake  H unsichtbar  = Eis  < > Wind  k Schlüssel  D Tür  X Schalter

function build(name, w, h, fn){
  const g=Array.from({length:h},()=>Array(w).fill(' '));
  const movers=[], portals=[], saws=[];
  const opts={rage:false,twists:[],lava:null,chase:null,subtitle:'',root:0,dark:false,theme:-1,finishRuns:0,plateNeed:1,mp:null,lives:0,rule:null,ruleN:0,secret:false,starsNeed:0,chaseTrigger:false};
  const set=(x,y,c)=>{ if(x>=0&&x<w&&y>=0&&y<h) g[y][x]=c; };
  const get=(x,y)=>(x>=0&&x<w&&y>=0&&y<h)?g[y][x]:'#';
  const G=h-3, O=h-4;
  const a={ G,O,set,get,
    ground:(x0,x1,top=G)=>{ for(let x=x0;x<=x1;x++) for(let y=top;y<h;y++) set(x,y,'#'); },
    block:(x0,y0,x1,y1)=>{ for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) set(x,y,'#'); },
    fill:(x0,y0,x1,y1,c)=>{ for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) set(x,y,c); },
    plat:(x,y,len)=>{ for(let i=0;i<len;i++) set(x+i,y,'-'); },
    spikes:(x0,x1,y=O)=>{ for(let x=x0;x<=x1;x++) set(x,y,'^'); },
    tspikes:(x0,x1,y=O)=>{ for(let x=x0;x<=x1;x++) set(x,y,'T'); },
    ceil:(x0,x1,y)=>{ for(let x=x0;x<=x1;x++) set(x,y,'v'); },
    cp:(x,y=O)=>set(x,y,'C'), finish:(x,y=O)=>set(x,y,'F'), start:(x,y=O)=>set(x,y,'S'), pad:(x,y=O)=>set(x,y,'J'),
    crystal:(x,y)=>set(x,y,'*'), key:(x,y)=>set(x,y,'k'), sw:(x,y)=>set(x,y,'X'), bounce:(x,y0,y1=y0)=>{ for(let y=y0;y<=y1;y++) set(x,y,'b'); },
    door:(x,y0,y1)=>{ for(let y=y0;y<=y1;y++) set(x,y,'D'); },
    barrier:(x,y0,y1)=>{ for(let y=y0;y<=y1;y++) set(x,y,'B'); },
    nbarrier:(x,y0,y1)=>{ for(let y=y0;y<=y1;y++) set(x,y,'N'); },
    crumble:(x,y,len)=>{ for(let i=0;i<len;i++) set(x+i,y,'~'); },
    hidden:(x,y,len)=>{ for(let i=0;i<len;i++) set(x+i,y,'H'); },
    ice:(x0,x1,y)=>{ for(let x=x0;x<=x1;x++) set(x,y,'='); },
    fake:(x0,y0,x1,y1)=>{ for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) set(x,y,'?'); },
    wind:(x0,y0,x1,y1,d)=>{ for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) if(get(x,y)===' ') set(x,y,d); },
    portal:(x1,y1,x2,y2,group)=>{ set(x1,y1,'P'); set(x2,y2,'P'); portals.push({x1,y1,x2,y2,group}); },
    // Lügen & Rätsel
    fspikes:(x0,x1,y=O)=>{ for(let x=x0;x<=x1;x++) set(x,y,'s'); },      // Fake-Stacheln (harmlos)
    ispikes:(x0,x1,y=O)=>{ for(let x=x0;x<=x1;x++) set(x,y,'i'); },      // unsichtbare Stacheln
    fcrumble:(x,y,len)=>{ for(let i=0;i<len;i++) set(x+i,y,'w'); },      // sieht rissig aus, hält
    fplat:(x,y,len)=>{ for(let i=0;i<len;i++) set(x+i,y,'_'); },         // Fake-Plattform
    fpad:(x,y=O)=>set(x,y,'j'), fkey:(x,y)=>set(x,y,'K'), gcp:(x,y=O)=>set(x,y,'g'),
    swB:(x,y)=>set(x,y,'Y'), qbar:(x,y0,y1)=>{ for(let y=y0;y<=y1;y++) set(x,y,'Q'); }, rbar:(x,y0,y1)=>{ for(let y=y0;y<=y1;y++) set(x,y,'R'); },
    tsw:(x,y)=>set(x,y,'Z'),
    // Neue Hindernisse
    laser:(x,y,dir)=>set(x,y,dir>0?'(':')'),          // Laser-Emitter, Strahl nach rechts/links im Takt
    cannon:(x,y,dir)=>set(x,y,dir>0?'[':']'),         // Kanone, schießt regelmäßig
    crusher:(x,y)=>set(x,y,'U'),                      // Fallblock an der Decke
    patrol:(x,y)=>set(x,y,'W'),                       // laufender Gegner
    goo:(x0,x1,y=O)=>{ for(let x=x0;x<=x1;x++) set(x,y,'G'); },   // Schleim: bremst
    espikes:(x0,x1,y=O)=>{ for(let x=x0;x<=x1;x++) set(x,y,'E'); }, // Stromplatte, gegenphasig zu T
    circsaw:(cx,cy,r,period,phase=0)=>saws.push({cx,cy,ax:r,ay:r,period,phase,circ:true}),
    // Level-Devil-Trolle
    trapdoor:(x0,x1,y=G)=>{ for(let x=x0;x<=x1;x++) set(x,y,','); },     // Boden öffnet sich, wenn man kurz drauf steht
    popup:(x0,x1,y=O)=>{ for(let x=x0;x<=x1;x++) set(x,y,':'); },        // unsichtbare Stacheln, schnellen hoch, wenn man ankommt
    vplat:(x,y,len)=>{ for(let i=0;i<len;i++) set(x+i,y,'.'); },         // Plattform, die beim Absprung verschwindet
    qspikes:(x0,x1,y=O)=>{ for(let x=x0;x<=x1;x++) set(x,y,'%'); },      // Quanten-Stacheln: nach jedem Tod neu echt/fake
    qplat:(x,y,len)=>{ for(let i=0;i<len;i++) set(x+i,y,'&'); },         // Quanten-Plattform
    qblock:(x0,y0,x1,y1)=>{ for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) set(x,y,'+'); }, // Quanten-Wand
    mazeGroup:(id)=>{ opts.mazeGroups=opts.mazeGroups||[]; opts.mazeGroups.push(id); },
    finishRuns:(n)=>{ opts.finishRuns=n; },
    plateNeed:(n)=>{ opts.plateNeed=n; }, mp:(m)=>{ opts.mp=m; },
    plate:(x,y=O)=>set(x,y,'1'),                                  // Koop-Druckplatte
    // Koop-Rätselbausteine
    lever:(x,y=O)=>set(x,y,'3'), lgate:(x,y0,y1)=>{ for(let y=y0;y<=y1;y++) set(x,y,'4'); },     // Hebel-Kette + Lampen-Tor
    seqPlate:(x,y=O)=>set(x,y,'5'), fgate:(x,y0,y1)=>{ for(let y=y0;y<=y1;y++) set(x,y,'6'); },  // Farbfolge-Platten + Tor
    tplate:(x,y=O)=>set(x,y,'7'), tgate:(x,y0,y1)=>{ for(let y=y0;y<=y1;y++) set(x,y,'8'); },    // Zeitplatte + Zeittor (5 s)
    smooth:(x0,y0,x1,y1)=>{ for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) set(x,y,'e'); },   // glatte Wand: kein Wandsprung
    over:(x,y,len)=>{ for(let i=0;i<len;i++) set(x+i,y,'u'); },                                // Überlast-Steg: trägt nur einen
    betray:(x,y=O)=>set(x,y,'0'),                                                              // Verräterplatte (sieht aus wie 1)
    orb:(x,y)=>set(x,y,'q'), altar:(x,y=O)=>set(x,y,'t'), ogate:(x,y0,y1)=>{ for(let y=y0;y<=y1;y++) set(x,y,'h'); }, // Kristall tragen
    lives:(n)=>{ opts.lives=n; }, rule:(r,n=0)=>{ opts.rule=r; opts.ruleN=n; }, secret:(n)=>{ opts.secret=true; opts.starsNeed=n; },
    star:(x,y)=>set(x,y,'n'), rockZone:(x0,x1)=>{ for(let x=x0;x<=x1;x++) if(get(x,1)===' ') set(x,1,'a'); }, chaseTrig:(x,y=O)=>{ set(x,y,'d'); opts.chaseTrigger=true; }, boulderTrig:(x,y=O)=>set(x,y,'m'), belt:(x0,x1,dir,y=G)=>{ for(let x=x0;x<=x1;x++) set(x,y,dir>0?'}':'{'); },
    cgate:(x,y0,y1)=>{ for(let y=y0;y<=y1;y++) set(x,y,'2'); },     // Koop-Tor: offen, solange jemand auf einer Platte steht (Solo: immer offen)
    // Lügen für Denker
    ccp:(x,y=O)=>set(x,y,'$'),                                   // verfluchter Checkpoint: sieht echt aus, schickt dich zurück
    dwall:(x,y0,y1)=>{ for(let y=y0;y<=y1;y++) set(x,y,'z'); },    // Dash-Wand: nur ohne Dash passierbar
    sgate:(x,y0,y1)=>{ for(let y=y0;y<=y1;y++) set(x,y,'y'); },    // Sprint-Tor: nur mit vollem Tempo passierbar
    camtrap:(x,y=O)=>set(x,y,'`'),                                // Kamera-Falle: Bild verschiebt sich
    rplat:(x,y,len)=>{ for(let i=0;i<len;i++) set(x+i,y,'r'); },   // Flucht-Plattform: rückt weg, wenn man kommt
    izone:(x0,y0,x1,y1)=>{ for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) if(get(x,y)===' ') set(x,y,'A'); }, // unsichtbare Spiegelzone
    iwind:(x0,y0,x1,y1,d)=>{ for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) if(get(x,y)===' ') set(x,y,d<0?'L':'M'); },
    mover:(cx,cy,w,ax,ay,period,phase=0)=>movers.push({cx,cy,w,ax,ay,period,phase}),
    saw:(cx,cy,ax,ay,period,phase=0)=>saws.push({cx,cy,ax,ay,period,phase}),
    theme:(t)=>{ opts.theme=t; },
    rage:()=>{ opts.rage=true; }, twist:(...t)=>{ opts.twists=t; }, lava:(row,speed)=>{ opts.lava={row,speed}; },
    chase:(speed)=>{ opts.chase={speed}; }, sub:(t)=>{ opts.subtitle=t; }, root:(r)=>{ opts.root=r; }, dark:()=>{ opts.dark=true; },
  };
  fn(a);
  let keysTotal=0; for(const r of g) for(const c of r) if(c==='k') keysTotal++;
  return {name, w, h, rows:g.map(r=>r.join('')), grid:g, movers, portals, saws, keysTotal, ...opts};
}
// Ärger-Streuer: verteilt nachträglich Gemeinheiten auf harmlosem Boden
function addStars(L,seed){
  const R=mkR(seed), g=L.grid, w=L.w, h=L.h; const at=(x,y)=>(x>=0&&x<w&&y>=0&&y<h)?g[y][x]:'#';
  const solidish=(x,y)=>'#=-_~w{}'.includes(at(x,y));
  const okSpot=(x,y)=>at(x,y)===' '&&at(x,y-1)===' '&&x>4&&x<w-6;
  const standable=(x,y)=>solidish(x,y)&&!solidish(x,y-1)&&at(x,y-1)!=='v';   // Kachel, auf der man stehen kann (Stacheln darüber zählen als frei)
  const cands=[];
  for(let x=5;x<w-6;x++) for(let y=2;y<h-3;y++){ if(!okSpot(x,y)) continue; let sc=0;
    // erreichbar: begehbare Fläche höchstens 3 Kacheln tiefer und 3 seitlich, oder eine Wand direkt daneben (Wandsprung)
    let near=null; for(let dy=1;dy<=3&&!near;dy++) for(let dx=-3;dx<=3;dx++) if(standable(x+dx,y+dy)){ near={dx,dy}; break; }
    const wall=(solidish(x-1,y)&&solidish(x-1,y+1)&&solidish(x-1,y+2))||(solidish(x+1,y)&&solidish(x+1,y+1)&&solidish(x+1,y+2));
    if(!near&&!wall) continue;
    if(at(x,y+1)==='^'||at(x,y+1)==='T') sc=3;                       // über Stacheln
    else if(near&&near.dy>=2&&y<=9) sc=3;                              // hoher Sprung auf eine Plattform
    else if(wall&&y<=8) sc=3;                                          // an einer hohen Wand
    else if(near&&Math.abs(near.dx)>=2) sc=2;                          // seitlich über der Kante
    else sc=1;
    cands.push({x,y,sc}); }
  if(!cands.length) return;
  const picks=[]; const thirds=[[5,w/3],[w/3,2*w/3],[2*w/3,w-6]];
  for(const [a,b] of thirds){ const c=cands.filter(q=>q.x>=a&&q.x<b); if(!c.length) continue; c.sort((p,q)=>q.sc-p.sc||R.f()-0.5); picks.push(c[Math.floor(R.f()*Math.min(4,c.length))]); }
  for(const q of picks) g[q.y][q.x]='n';
  L.rows=g.map(r=>r.join(''));
}
function annoy(L,seed,rate){
  if(L.dark) rate*=1.7;   // dunkle Level: mehr Fallen, aber (siehe unten) keine Gegner
  const R=mkR(seed), g=L.grid, w=L.w, h=L.h, O=h-4;
  const enemiesOk=!L.dark;
  const at=(x,y)=>(x>=0&&x<w&&y>=0&&y<h)?g[y][x]:'#';
  const plainAround=(x,y)=>[-2,-1,0,1,2].every(dx=>at(x+dx,y)===' '&&at(x+dx,y+1)==='#')&&at(x,y-1)===' '&&at(x,y-2)===' ';
  const specialNear=(x,y)=>[-3,-2,-1,0,1,2,3].some(dx=>'SFCcfDkKXYZPJ12dmn35701qt'.includes(at(x+dx,y))||'SFCcfDkKXYZPJ12dmn35701qt'.includes(at(x+dx,y-1)));
  let placed=0;
  for(let x=6;x<w-8;x++){ const y=O;
    if(!plainAround(x,y)||specialNear(x,y)) continue;
    if(R.f()>rate) continue;
    const r=R.f();
    if(r<0.22) g[y][x]='s';
    else if(r<0.34){ g[y][x]='^'; }
    else if(r<0.42&&rate>0.06){ g[y][x]='i'; }
    else if(r<0.52){ g[y+1][x]='w'; g[y+1][x+1]='w'; }
    else if(r<0.60){ g[y+1][x]='~'; }
    else if(r<0.68){ g[y][x]=R.pick(['!','o','V','@']); }
    else if(r<0.74){ g[y][x]='j'; }
    else if(r<0.80){ g[y][x]='g'; }
    else if(r<0.86){ g[y][x]='x'; g[y][x]=' '; g[y-2][x]='x'; }
    else if(r<0.92){ for(let yy=y-4;yy<=y;yy++) for(let xx=x-1;xx<=x+1;xx++) if(at(xx,yy)===' ') g[yy][xx]=R.f()<0.5?'L':'M'; }
    else { if(enemiesOk) L.saws.push({cx:x,cy:O-3,ax:0,ay:2.5,period:2.4,phase:R.f()*6}); else g[y][x]='V'; }
    placed++; x+=3;
  }
  // zweite Runde: neue Hindernisse auf freien Stellen
  for(let x=8;x<w-10;x++){ const y=O;
    if(!plainAround(x,y)||specialNear(x,y)) continue;
    if(R.f()>rate*0.9) continue;
    const r=R.f();
    if(r<0.14){ if(enemiesOk) g[y][x]='W'; else g[y][x]=R.pick([':','%',',']); }
    else if(r<0.26){ if(enemiesOk) g[y][x]=R.f()<0.5?'[':']'; else { g[y][x]='?'; g[y+1][x]='?'; } }
    else if(r<0.38){ for(let i=0;i<3;i++) g[y][x+i-1]='G'; }
    else if(r<0.50){ for(let i=0;i<3;i++) g[y][x+i-1]='E'; }
    else if(r<0.62&&at(x,y-4)===' '){ let yy=y-1; while(yy>1&&at(x,yy-1)===' ') yy--; if(y-yy>=4) g[yy][x]='U'; }
    else if(r<0.74&&rate>0.06){ g[y-1][x]=R.f()<0.5?'(':')'; }
    else if(r<0.86){ if(enemiesOk) L.saws.push({cx:x,cy:O-2,ax:2,ay:2,period:3,phase:R.f()*6,circ:true}); else { g[y][x]='j'; g[y][x+2]='@'; } }
    else { g[y][x]='^'; g[y][x+1]='s'; }
    placed++; x+=4;
  }
  // dritte Runde: Level-Devil-Trolle und Quanten-Elemente
  for(let x=10;x<w-12;x++){ const y=O;
    if(!plainAround(x,y)||specialNear(x,y)) continue;
    if(R.f()>rate*0.8) continue;
    const r=R.f();
    if(r<0.22){ g[y+1][x]=','; g[y+1][x+1]=','; }
    else if(r<0.44){ g[y][x]=':'; g[y][x+1]=':'; }
    else if(r<0.62){ g[y][x]='%'; g[y][x+1]='%'; g[y][x+2]=R.f()<0.5?'%':'^'; }
    else if(r<0.76&&at(x,y-3)===' '&&at(x+1,y-3)===' '){ g[y-3][x]='.'; g[y-3][x+1]='.'; g[y][x+1]='^'; }
    else if(r<0.88){ g[y][x]='+'; g[y-1][x]='+'; }
    else { g[y][x]='&'; }
    placed++; x+=4;
  }
  // vierte Runde: Lügen für Denker
  for(let x=12;x<w-14;x++){ const y=O;
    if(!plainAround(x,y)||specialNear(x,y)) continue;
    if(R.f()>rate*0.55) continue;
    const r=R.f();
    if(r<0.2&&rate>0.08){ g[y][x]='$'; }
    else if(r<0.4){ g[y][x]='z'; g[y-1][x]='z'; g[y-2][x]='z'; }
    else if(r<0.55){ g[y][x]='y'; g[y-1][x]='y'; g[y-2][x]='y'; }
    else if(r<0.7){ g[y][x]='`'; }
    else if(r<0.85){ for(let yy=y-3;yy<=y;yy++) for(let xx=x-1;xx<=x+2;xx++) if(at(xx,yy)===' ') g[yy][xx]='A'; }
    else if(at(x,y-3)===' '&&at(x+1,y-3)===' '&&at(x+2,y-3)===' '){ g[y-3][x]='r'; g[y-3][x+1]='r'; g[y][x+1]='^'; g[y][x+2]='^'; }
    placed++; x+=5;
  }
  // Stacheln teilweise durch Quanten-Stacheln ersetzen
  if(rate>0.07) for(let y=0;y<h;y++) for(let x=0;x<w;x++) if(g[y][x]==='^'&&R.f()<0.25) g[y][x]='%';
  // lange leere Böden: mindestens eine Gemeinheit pro 10 Kacheln
  let run=0;
  for(let x=4;x<w-6;x++){ const y=O; const plain=at(x,y)===' '&&at(x,y+1)==='#'&&!specialNear(x,y); run=plain?run+1:0;
    if(run>=10){ const px=x-R.i(2,7); if(plainAround(px,y)){ const rr=R.f(); if(rr<0.3) g[y][px]='^'; else if(rr<0.5) g[y][px]=enemiesOk?'W':':'; else if(rr<0.65){ g[y][px]='G'; g[y][px+1]='G'; } else if(rr<0.8) g[y][px]='E'; else g[y][px]=R.pick(['!','o','@','s','j','x']); placed++; } run=0; } }
  L.rows=g.map(r=>r.join('')); return placed;
}

// ---------- RAGE-Level (prozedural, feste Seeds = immer gleiches Level) ----------
function rng(seed){ let s=seed>>>0; return ()=>{ s=(Math.imul(s,1664525)+1013904223)>>>0; return s/4294967296; }; }
function genTower(seed){
  const w=40, h=120, rnd=rng(seed), ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  return build(seed===1337?'Der Turm':'Turm', w, h, a=>{
    a.sub('Kein Checkpoint. Kein Mitleid.'); a.root(-7); a.theme(12); a.rage(); a.twist('release'); a.lava(h-1,0.42);
    a.start(3); a.ground(0,w-1);
    let xe=6, y=a.O, dir=1, sinceWind=0, n=0;
    while(y>10){
      const dy=ri(1,3), maxdx=dy===3?3:dy===2?4:5, dx=ri(Math.max(2,maxdx-1),maxdx);
      let len=ri(2,3), nx=xe+dir*dx;
      if(dir>0&&nx+len>w-2){ dir=-1; nx=xe-dx; } else if(dir<0&&nx-len<1){ dir=1; nx=xe+dx; }
      const ny=y-dy, r=rnd();
      let type='-'; if(n>3){ if(r<0.18) type='~'; else if(r<0.30) type='='; else if(r<0.40) type='H'; }
      if(type==='H') len=1;
      const x0=dir>0?nx:nx-len+1;
      for(let i=0;i<len;i++) a.set(x0+i,ny+1,type);
      if(type==='-'&&len===3&&n>6&&rnd()<0.15) a.set(dir>0?x0+len-1:x0,ny,'^');
      if(n>2&&rnd()<0.4){ const fx=x0+dir*(len+ri(2,3)), fy=ny+1-ri(0,1);
        for(let i=0;i<3;i++){ const cx=fx+i*dir; if(cx>0&&cx<w-1&&a.get(cx,fy)===' '&&a.get(cx,fy-1)===' ') a.set(cx,fy,'?'); } }
      sinceWind+=dy;
      if(sinceWind>16&&rnd()<0.6){ sinceWind=0; const wd=rnd()<0.5?'<':'>'; for(let yy=ny-2;yy<=ny;yy++) for(let xx=1;xx<w-1;xx++) if(a.get(xx,yy)===' ') a.set(xx,yy,wd); }
      xe=dir>0?x0+len-1:x0; y=ny; n++;
    }
    const fx=Math.max(3,Math.min(w-4,xe+dir*3));
    a.block(fx-2,y-1,fx+2,y-1); a.finish(fx,y-2);
  });
}
function genAbyss(seed){
  const w=260, h=17, rnd=rng(seed), ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  return build('Der Abgrund', w, h, a=>{
    a.sub('Sie kommt. Sie hört nicht auf.'); a.root(-9); a.theme(13); a.rage(); a.twist('rotate'); a.chase(4.0);
    a.start(2); a.ground(0,9);
    let xe=9, y=a.O, n=0;
    while(xe<w-14){
      let dy=ri(-2,2); if(y+dy<a.O-6) dy=1; if(y+dy>a.O) dy=-1;
      const maxdx=dy<=-2?4:dy===-1?5:dy===0?6:7, dx=ri(Math.max(3,maxdx-2),maxdx), ny=y+dy, nx=xe+dx;
      const len=ri(3,6), r=rnd();
      let type='#'; if(n>1){ if(r<0.15) type='~'; else if(r<0.28) type='='; else if(r<0.40) type='?'; }
      if(type==='#'||type==='='){ a.ground(nx,nx+len-1,ny+1); if(type==='=') a.ice(nx,nx+len-1,ny+1);
        if(len>=4&&n>2&&rnd()<0.35) a.set(nx+ri(2,len-1),ny,'^'); }
      else if(type==='~'){ a.crumble(nx,ny+1,len); }
      else { a.fake(nx,ny+1,nx+len-1,h-1); a.hidden(nx+1,ny-2,2); }
      if(n>3&&rnd()<0.25){ const wd=rnd()<0.6?'<':'>'; a.wind(xe+1,ny-4,nx-1,ny+1,wd); }
      xe=nx+len-1; y=type==='?'?ny-3:ny; n++;
    }
    a.ground(xe+4,w-1,y+1); a.finish(w-4,y);
  });
}

function mirrorLevel(L){
  const swap={'<':'>','>':'<','(':')',')':'(','[':']',']':'[','L':'M','M':'L'};
  L.rows=L.rows.map(r=>r.split('').reverse().map(c=>swap[c]||c).join('')); L.grid=L.rows.map(r=>r.split(''));
  const m=L.w-1; L.movers.forEach(mv=>{ mv.cx=L.w-mv.cx; }); L.saws.forEach(sw=>{ sw.cx=m-sw.cx; });
  L.portals.forEach(q=>{ q.x1=m-q.x1; q.x2=m-q.x2; }); L.chase=null; L.rows0=null; return L;
}

function genShaft(seed){

    a.block(0,0,0,h-1); a.block(w-1,0,w-1,h-1); a.block(1,4,10,4); a.start(3,3);

      else if(r<0.4) a.laser(side>0?w-2:1,y-2,-side);

      else if(r<0.8) a.crumble(x0,y,len);

  if(lvl.chase){ const wx=chaseX(); if(wx>cam.x-100){ const g=dc.createLinearGradient(wx-140,0,wx+40,0); g.addColorStop(0,'rgba(255,40,60,0)'); g.addColorStop(1,'rgba(255,60,80,0.5)'); dc.fillStyle=g; dc.fillRect(wx-140,cam.y-50,180,H+100); } }
  for(const m of MP.remote?Object.values(MP.remote):[]) if(!m.dead) lamp(m.x+P.w/2,m.y+P.h/2,dark?150:90,'220,230,255',dark?0.9:0.2,dark);
  // Lichtkarte anwenden
  ctx.save(); ctx.globalCompositeOperation='multiply'; ctx.imageSmoothingEnabled=true; ctx.drawImage(lightC,0,0,W,H); ctx.restore();
  // farbiger Glanz der Lichtquellen
  ctx.save(); ctx.globalCompositeOperation='lighter';
  const glow=(x,y,r,col,a)=>{ let lx=x-cam.x-sx; if(vertigoT>0) lx=W-lx; const ly=y-cam.y-sy; if(lx<-r||lx>W+r||ly<-r||ly>H+r) return; const g=ctx.createRadialGradient(lx,ly,0,lx,ly,r); g.addColorStop(0,'rgba('+col+','+a+')'); g.addColorStop(1,'rgba('+col+',0)'); ctx.fillStyle=g; ctx.fillRect(lx-r,ly-r,r*2,r*2); };
  n=0; for(const L of srcs){ if(n++>=cap) break; glow(L.x,L.y,L.r*0.9,L.col,dark?0.22:0.09); }
  if(p.deadT<=0) glow(px,py,dark?150:90,p.dashT>0?'168,240,255':'255,220,140',dark?0.26:0.05);
  ctx.restore();
}

function menuInput(code){
  if(mpMenuInput(code)) return;
  const up=code==='ArrowUp'||code==='KeyW'||code==='GP_U', down=code==='ArrowDown'||code==='KeyS'||code==='GP_D';
  const left=code==='ArrowLeft'||code==='KeyA'||code==='GP_L', right=code==='ArrowRight'||code==='KeyD'||code==='GP_R';
  const ok=code==='Enter'||code==='NumpadEnter'||code==='Space'||code==='GP_A'||code==='GP_START', back=code==='Escape'||code==='GP_SELECT'||code==='Backspace';
  if(S.mode==='title'){
    if(code==='KeyU'){ if(UPD.available&&UPD.launcher) applyUpdate(); else checkUpdate(true); }
    if(up){ S.sel=(S.sel+TITLE_ITEMS.length-1)%TITLE_ITEMS.length; SFX.menu(); } if(down){ S.sel=(S.sel+1)%TITLE_ITEMS.length; SFX.menu(); }
    if(ok){ SFX.select(); if(S.sel===5){ quitGame(); return; } S.mode=['modeSelect','howto','records','achievements','settings'][S.sel]; if(DEMO&&S.mode==='modeSelect') S.mode='levels'; S.sub=0; S.page=0; S.sel=0; }
  } else if(S.mode==='levels'){
    const N=LEVELS.length, rows=N+1;
    const C=6; if(down){ S.sel=S.sel<N-C?S.sel+C:N; SFX.menu(); } if(up){ S.sel=S.sel===N?N-1:Math.max(0,S.sel-C); SFX.menu(); }
    if(right){ S.sel=(S.sel+1)%rows; SFX.menu(); } if(left){ S.sel=(S.sel+rows-1)%rows; SFX.menu(); }
    if(ok&&S.sel<N&&LEVELS[S.sel].secret&&totalStars()<LEVELS[S.sel].starsNeed){ SFX.back(); toasts.push({t:2.5,txt:'Gesperrt: '+LEVELS[S.sel].starsNeed+' Sterne nötig',sub:'Du hast '+totalStars()}); return; }
    if(ok){ SFX.select(); S.lastLevel=S.sel; if(MP.pick){ if(S.sel<N) NET.send({t:'start',level:S.sel,mode:MP.mode,seed:Math.floor(Math.random()*1e9)}); } else if(S.sel<N){ marathon=false; startLevel(S.sel); } else { marathon=true; marathonTotal=0; marathonDeaths=0; marathonNewBest=false; startLevel(0); } }
    if(back){ SFX.back(); if(MP.pick){ MP.pick=false; S.mode='lobby'; } else if(DEMO){ S.mode='title'; S.sel=0; } else { S.mode='modeSelect'; S.sel=0; } }
  } else if(S.mode==='howto'){
    if(right||down||ok){ S.page=(S.page+1)%HOWTO.length; SFX.menu(); } if(left||up){ S.page=(S.page+HOWTO.length-1)%HOWTO.length; SFX.menu(); }
    if(back){ SFX.back(); S.mode='title'; S.sel=1; }
  } else if(S.mode==='records'){
    if(back||ok){ SFX.back(); S.mode='title'; S.sel=2; }
  } else if(S.mode==='achievements'){
    if(back||ok){ SFX.back(); S.mode='title'; S.sel=3; }
  } else if(S.mode==='settings'){
    const it=SETTINGS_ITEMS[S.sel];
    if(up){ S.sel=(S.sel+SETTINGS_ITEMS.length-1)%SETTINGS_ITEMS.length; S.confirm=false; SFX.menu(); } if(down){ S.sel=(S.sel+1)%SETTINGS_ITEMS.length; S.confirm=false; SFX.menu(); }
    TEXT.field=SETTINGS_ITEMS[S.sel].k==='server'?'server':(SETTINGS_ITEMS[S.sel].k==='serverLan'?'serverLan':null);
    if(it.type==='pct'&&(left||right)){ SET[it.k]=clamp(SET[it.k]+(right?5:-5),0,100); saveSettings(); SFX.menu(); }
    if(it.type==='bool'&&(left||right||ok)){ SET[it.k]=!SET[it.k]; saveSettings(); SFX.select(); if(it.k==='lowgfx') fit(); }
    if(it.k==='reset'&&ok){ if(!S.confirm){ S.confirm=true; SFX.menu(); } else { for(let i=0;i<LEVELS.length;i++){ ['best','ghost','splits','runs','stars'].forEach(k=>{ storeDel('speedrun.'+k+'.'+i); storeDel('speedrun.'+k+'.'+lk(i)); }); } storeDel('speedrun.marathon'); storeDel('speedrun.lifedeaths'); S.confirm=false; SFX.door(); } }
    if(it.k==='back'&&ok){ SFX.back(); TEXT.field=null; S.mode=S.from||'title'; S.from=null; S.sel=S.mode==='paused'?0:4; }
    if(back){ SFX.back(); TEXT.field=null; S.mode=S.from||'title'; S.from=null; S.sel=S.mode==='paused'?0:4; }
  } else if(S.mode==='play'){
    if(code==='KeyR'){ SFX.back(); restart(); }
    if(back){ S.mode='paused'; S.sel=0; runPaused=running||runPaused; SFX.menu(); }
  } else if(S.mode==='paused'){
    const PI=pauseItems(); if(up){ S.sel=(S.sel+PI.length-1)%PI.length; SFX.menu(); } if(down){ S.sel=(S.sel+1)%PI.length; SFX.menu(); }
    if(back){ S.mode='play'; SFX.back(); }
    if(ok){ SFX.select(); const it=PI[S.sel]; if(it==='Weiter') S.mode='play'; else if(it==='Level neu starten') restart(); else if(it==='Levelauswahl'){ spentFlush(); S.mode='levels'; S.sel=li; } else if(it==='Raum verlassen') mpLeaveToMenu(); else { S.from='paused'; S.mode='settings'; S.sel=0; } }
  } else if(S.mode==='finished'&&MP.active){
    if(ok&&NET.host){ SFX.select(); const set=MPSETS[MP.set]||MPSETS.pvp; NET.send({t:'start',set:MP.set,level:(MP.level+1)%set.length,mode:MP.mode,seed:Math.floor(Math.random()*1e9)}); }
    if(code==='KeyL'&&NET.host){ SFX.select(); S.mode='mpLevels'; S.sel=MP.level; }
    if(back){ SFX.back(); NET.leave(); spentFlush(); S.mode='modeSelect'; S.sel=0; }
  } else if(S.mode==='finished'){
    if(code==='KeyR'||code==='GP_SELECT'){ SFX.select(); restart(); }
    if(ok||code==='KeyN'){ SFX.select(); nextLevel(); }
    if(back){ SFX.back(); spentFlush(); S.mode='levels'; S.sel=li; }
  }
}

function mpPlateActive(){ if(!p||!lvl||!MP.active||MP.mode!=='coop') return true; const now=performance.now(); const set=new Set();

  else if(j===b.length-1){ const B=b[j], A=b[j-1]||B; const span=Math.max(1,B.t-A.t); vx=(B.x-A.x)/span; vy=(B.y-A.y)/span; const ext=Math.min(150,now-B.t); r.x=B.x+vx*ext; r.y=B.y+vy*ext; }

function mpResolvePlayers(){ p.carried=null; const wasGround=p.onGround;
  for(const id in MP.remote){ const r=MP.remote[id]; if(r.x===undefined||r.dead) continue; const rx=r.x, ry=r.y;
    if(!overlap(p.x,p.y,P.w,P.h,rx,ry,P.w,P.h)){ if(p.vy>=0&&Math.abs((p.y+P.h)-ry)<=3&&p.x<rx+P.w-4&&p.x+P.w>rx+4){ p.y=ry-P.h-0.01; p.vy=0; p.onGround=true; p.carried=r; } continue; }

function mpMenuInput(code){

  if(S.mode==='modeSelect'){ if(up){ S.sel=(S.sel+2)%3; SFX.menu(); } if(down){ S.sel=(S.sel+1)%3; SFX.menu(); } if(back){ SFX.back(); S.mode='title'; S.sel=0; }
    if(ok){ SFX.select(); if(S.sel===0){ MP.active=false; S.mode='levels'; S.sel=S.lastLevel||0; } else { MP.mode=S.sel===1?'coop':'pvp'; S.mode='mpMenu'; S.sel=0; TEXT.field='name'; NET.err=''; NET.status=''; } } return true; }
  if(S.mode==='mpMenu'){
    if(up){ S.sel=(S.sel+MP_ITEMS.length-1)%MP_ITEMS.length; SFX.menu(); } if(down){ S.sel=(S.sel+1)%MP_ITEMS.length; SFX.menu(); }
    TEXT.field=S.sel===0?'name':(S.sel===3?'code':null);
    if(S.sel===1&&(left||right||ok)){ MP.color=(MP.color+(left?PLAYER_COLORS.length-1:1))%PLAYER_COLORS.length; SFX.menu(); }
    if(ok&&(S.sel===2||S.sel===4)){ const name=(TEXT.name||'Spieler').trim()||'Spieler'; storeSet('speedrun.name',name); NET.err=''; NET.connect().then(()=>{ if(S.sel===2) NET.send({t:'create',name,color:MP.color}); else NET.send({t:'join',code:TEXT.code,name,color:MP.color}); }).catch(()=>{}); }
    if(ok&&S.sel===0){ S.sel=2; TEXT.field=null; } if(ok&&S.sel===3){ S.sel=4; TEXT.field=null; }
    if((ok&&S.sel===5)||back){ SFX.back(); TEXT.field=null; S.mode='modeSelect'; S.sel=MP.mode==='pvp'?2:1; } return true; }
  if(S.mode==='lobby'){ if(back){ SFX.back(); NET.leave(); S.mode='modeSelect'; S.sel=0; } if(ok&&NET.host){ SFX.select(); MP.set=mpSetName(); S.mode='mpLevels'; S.sel=0; } return true; }

    if(back){ SFX.back(); S.mode='lobby'; S.sel=0; } if(ok){ SFX.select(); NET.send({t:'start',set:MP.set,level:S.sel,mode:MP.mode,seed:Math.floor(Math.random()*1e9)}); } return true; }
  return false;
}
// Text-Eingabe (Name, Raum-Code, Server-Adresse)
addEventListener('keydown',e=>{ if(!TEXT.field) return; if(e.key==='Backspace'){ e.preventDefault(); if(TEXT.field==='name'){ TEXT.name=TEXT.name.slice(0,-1); storeSet('speedrun.name',TEXT.name); } else if(TEXT.field==='code') TEXT.code=TEXT.code.slice(0,-1); else if(TEXT.field==='server'){ TEXT.server=TEXT.server.slice(0,-1); storeSet('speedrun.server',TEXT.server); } else if(TEXT.field==='serverLan'){ TEXT.serverLan=TEXT.serverLan.slice(0,-1); storeSet('speedrun.serverLan',TEXT.serverLan); } return; }
  if(e.key.length!==1||e.ctrlKey||e.altKey) return; e.stopImmediatePropagation(); e.preventDefault();
  if(TEXT.field==='name'&&TEXT.name.length<14&&/[\wäöüÄÖÜß \-]/.test(e.key)){ TEXT.name+=e.key; storeSet('speedrun.name',TEXT.name); }
  else if(TEXT.field==='code'&&TEXT.code.length<5&&/[a-zA-Z0-9]/.test(e.key)) TEXT.code+=e.key.toUpperCase();
  else if(TEXT.field==='server'&&TEXT.server.length<80&&/[\w\.\-:\/]/.test(e.key)){ TEXT.server+=e.key; storeSet('speedrun.server',TEXT.server); }
  else if(TEXT.field==='serverLan'&&TEXT.serverLan.length<80&&/[\w\.\-:\/]/.test(e.key)){ TEXT.serverLan+=e.key; storeSet('speedrun.serverLan',TEXT.serverLan); } },true);

// ---------- Auto-Updater: Server liefert /game/version.json, der Launcher (127.0.0.1:47831) spielt Updates ein ----------
const UPD={ remote:null, available:false, launcher:false, status:'', busy:false, lastCheck:0 };
const toHttp=u=>u.trim().replace(/^wss:/,'https:').replace(/^ws:/,'http:').replace(/\/$/,'');
function serverHttp(){ return toHttp(NET.usedUrl||TEXT.server); }
async function fetchAny(path){ const urls=[toHttp(TEXT.server),toHttp(TEXT.serverLan)].filter(u=>u); let last; for(const u of urls){ try{ const r=await fetch(u+path+'?t='+Date.now(),{cache:'no-store'}); if(r.ok) return r; }catch(e){ last=e; } } throw last||new Error('unreachable'); }
async function checkUpdate(manual){ if(DEMO) return; if(UPD.busy) return; UPD.busy=true; UPD.status='Prüfe auf Updates...';
  try{ const r=await fetchAny('/game/version.json'); const j=await r.json(); UPD.remote=j.version; UPD.available=!!j.version&&j.version>GAME_VERSION; UPD.status=UPD.available?('Update verfügbar: '+j.version):'Spiel ist aktuell'; }
  catch(e){ UPD.status=manual?'Update-Server nicht erreichbar':''; }
  try{ const r=await fetch('http://127.0.0.1:47831/ping',{cache:'no-store'}); const j=await r.json(); UPD.launcher=!!j.launcher; }catch(e){ UPD.launcher=false; }
  UPD.busy=false; UPD.lastCheck=performance.now();
  if(UPD.available){ toasts.push({t:6,txt:'Update '+UPD.remote+' verfügbar',sub:UPD.launcher?'wird installiert, Spiel startet neu':'Bitte neue Setup-Datei installieren'}); if(UPD.launcher&&(S.mode==='title'||S.mode==='levels')&&!MP.active) applyUpdate(); } }
async function applyUpdate(){ if(!UPD.launcher||UPD.busy) return; UPD.busy=true; UPD.status='Update wird installiert, Spiel startet gleich neu...';
  try{ const r=await fetch('http://127.0.0.1:47831/update?t='+Date.now()); const j=await r.json(); UPD.status=j.ok?'Neustart...':('Update fehlgeschlagen: '+j.status); }catch(e){ UPD.status='Launcher antwortet nicht'; }
  UPD.busy=false; }
setTimeout(()=>checkUpdate(false),2500); setInterval(()=>{ if(S.mode==='title'||S.mode==='levels') checkUpdate(false); },10*60*1000);

</script>
